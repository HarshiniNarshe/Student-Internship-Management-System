{% load static %}
<!DOCTYPE html>
<html>
<head>
	<title>online bootstrap page</title>
	<link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}">
	<script type="text/javascript" src="{% static 'js/bootstrap.bundle.min.js' %}"></script>


</head>
<body>
	<div class="container mt-4 col-md-5">
		<div class="card card-header bg-warning">
			<div class="card card-body">
				<h2 class="text-center bg-info">Login Form</h2>
				<form>
					<input type="text" name="uname" placeholder="Enter Username" class="form-control my-4">
					<input type="password" name="psw" placeholder="Enter Password" class="form-control my-4">
					<div class="text-center">
						<button class="btn btn-success">Login</button>
						
					</div>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
