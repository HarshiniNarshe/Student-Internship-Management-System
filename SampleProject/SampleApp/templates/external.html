{% load static %}
<!DOCTYPE html>
<html>
<head>
	<title>registration page</title>
	<link rel="stylesheet" type="text/css" href="{% static 'css/sample.css' %}">
	<script type="text/javascript" src="{% static 'js/sample.js' %}">
	</script>

	<style type="text/css">
		body{
			background-image: url("{% static 'images/Backgroundimage.jpg' %}");
			background-repeat: no-repeat;
			background-size: cover;
		}
	</style>
</head>
<body>
	<h2>Registration Form</h2>
	<form method="POST">
		{% csrf_token %}
		<h3>Enter Username :  </h3><input type="text" name="uname" placeholder="Enter your username"><br>
		<br>
		<h3>Enter mobile number :  </h3><input type="number" name="mbl" placeholder="Enter your mobile number"><br>
		<br>
		<h3>Enter email :  </h3><input type="email" name="em" placeholder ="Enter email address"><br>
		<br>
		<h3>Enter password :  </h3><input type ="password" name ="pwd" placeholder="Enter password"><br>
		<br>
		<h3>Enter confirm password :  </h3><input type="password" name="cpwd" placeholder="Confirm password"><br>
		<br>
		<button><b>Register</b></button>
		<!-- <input type="submit" name ="submit" value="Register" -->

	</form>
	<img src="{% static 'images/logo.png' %}">

</body>
</html>
